name: GkTeDPI Android CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build GkTeDPI v6 APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GkTeDPI
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure Native Sources Present
        run: |
          if [ ! -f "app/src/main/cpp/byedpi/main.c" ]; then
            rm -rf app/src/main/cpp/byedpi
            git clone --depth 1 https://github.com/hufrea/byedpi.git app/src/main/cpp/byedpi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34, NDK 26.1 & CMake 3.22.1
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for gradlew
        run: |
          chmod +x gradlew
          rm -f local.properties

      - name: Prepare Release Keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${SECRET_KEYSTORE_B64}" ]; then
            echo "${SECRET_KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${SECRET_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${SECRET_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> "$GITHUB_ENV"
          elif [ -f "keystore/gktedpi-release.jks" ] && keytool -list -keystore "keystore/gktedpi-release.jks" -storepass "gktedpi2026" >/dev/null 2>&1; then
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/keystore/gktedpi-release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=gktedpi2026" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=gktedpi" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=gktedpi2026" >> "$GITHUB_ENV"
          else
            keytool -genkeypair \
              -keystore "${RUNNER_TEMP}/ci-release.jks" \
              -storetype PKCS12 \
              -alias gktedpi \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass gktedpi2026 \
              -keypass gktedpi2026 \
              -dname "CN=GkTeDPI, OU=GkTe Archive, O=SametGkTe, C=TR"
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/ci-release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=gktedpi2026" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=gktedpi" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=gktedpi2026" >> "$GITHUB_ENV"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Universal & Per-ABI Signed Release APKs
        env:
          SPLIT_APK: "true"
        run: |
          ./gradlew assembleRelease --no-daemon
          mkdir -p dist-apks
          for apk in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk" | sed 's/app-/GkTeDPI-v6.0.0-/')
            cp "$apk" "dist-apks/$base"
          done
          cd dist-apks && sha256sum *.apk > SHA256SUMS.txt

      - name: Upload GkTeDPI APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GkTeDPI-v6.0.0-APKs
          path: dist-apks/*
          retention-days: 30