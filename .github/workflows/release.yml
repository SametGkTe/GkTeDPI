name: GkTeDPI GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GkTeDPI Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GkTeDPI with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 26.1 & CMake 3.22.1
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore (Optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> $GITHUB_ENV

      - name: Build Release APKs
        env:
          SPLIT_APK: "true"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p release-assets
          TAG_NAME="${GITHUB_REF_NAME}"
          for apk in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk" | sed "s/app-/GkTeDPI-${TAG_NAME}-/")
            cp "$apk" "release-assets/$base"
          done
          cd release-assets && sha256sum *.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
